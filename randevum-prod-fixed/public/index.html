<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Randevum — Berber Paneli</title><link rel="manifest" href="/manifest.json"><style>body{margin:0;font-family:Inter,system-ui;background:#0b0b0d;color:#f6f0e5}*{box-sizing:border-box}.wrap{max-width:1100px;margin:auto;padding:28px}.brand{font-size:28px;font-weight:900}.muted{color:#aaa}.card{background:#151518;border:1px solid #29292d;border-radius:20px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#e8c77b;color:#16120a;font-weight:800;cursor:pointer}.btn.dark{background:#29292d;color:#fff}.input,select{width:100%;padding:13px;border-radius:11px;border:1px solid #333;background:#101012;color:#fff;margin:6px 0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:10px 13px;border-radius:10px;background:#202024;cursor:pointer}.tab.active{background:#e8c77b;color:#111}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #29292d}.pill{font-size:12px;padding:5px 8px;border-radius:99px;background:#252529}.ok{color:#75e39a}.err{color:#ff7777}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.small{font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">✂ RANDEVUM</div><div class="muted">Berberler için sade randevu sistemi</div></div><button id="logout" class="btn dark hidden">Çıkış</button></div><section id="auth" class="card"><div class="tabs"><div id="tLogin" class="tab active">Giriş Yap</div><div id="tReg" class="tab">Hesap Oluştur</div></div><form id="form"><label>E-posta</label><input class="input" id="email" type="email" required><label>Şifre</label><input class="input" id="password" type="password" minlength="6" required><div id="bizWrap" class="hidden"><label>İşletme adı</label><input class="input" id="bizName"></div><button class="btn" id="submit">Giriş Yap</button><p id="msg" class="small"></p></form></section><section id="app" class="hidden"><div class="card"><div class="top"><div><h2 id="bizTitle"></h2><div class="muted" id="link"></div></div><button class="btn" onclick="copyLink()">Linki Kopyala</button></div></div><div class="tabs"><div class="tab active" data-tab="randevular">Randevular</div><div class="tab" data-tab="hizmetler">Hizmetler</div><div class="tab" data-tab="ayarlar">Ayarlar</div></div><div id="randevular" class="tabpane card"></div><div id="hizmetler" class="tabpane card hidden"></div><div id="ayarlar" class="tabpane card hidden"></div></section></main><script>let me=null,mode='login';const $=id=>document.getElementById(id);async function api(u,o={}){let r;try{r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o})}catch(e){throw Error('Sunucuya bağlanılamadı. Site sunucusunun çalıştığından emin olun.')}let d={};try{d=await r.json()}catch(e){throw Error('Sunucudan geçersiz yanıt alındı.')}if(!r.ok)throw Error(d.error||('İstek başarısız: '+r.status));return d}function render(){if(!me){$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('bizTitle').textContent=me.business.name;$('link').textContent=location.origin+me.business.publicUrl;renderApt();renderSvc();renderSettings()}function renderApt(){$('randevular').innerHTML='<h3>Randevular</h3>'+(me.appointments.length?me.appointments.map(a=>{let s=me.services.find(x=>x.id===a.serviceId);return `<div class="row"><div><b>${a.date} • ${a.time}</b><br>${a.customerName} · ${s?.name||''}<br><span class="muted small">${a.phone}</span></div><div><span class="pill">${a.status==='completed'?'Tamamlandı':'Bekliyor'}</span>${a.status!=='completed'?` <button class="btn" onclick="complete('${a.id}')">Tamamla</button>`:''}</div></div>`}).join(''):'<p class="muted">Henüz randevu yok.</p>')}async function complete(id){await api('/api/appointments/'+id,{method:'PATCH',body:JSON.stringify({status:'completed'})});await load()}function renderSvc(){$('hizmetler').innerHTML='<h3>Hizmetler</h3>'+me.services.map(s=>`<div class="row"><div><b>${s.name}</b><br><span class="muted">${s.duration} dk · ${s.price} TL</span></div><button class="btn dark" onclick="delSvc('${s.id}')">Sil</button></div>`).join('')+`<hr><form id="svc"><div class="grid"><input class="input" name="name" placeholder="Hizmet adı" required><input class="input" name="price" type="number" placeholder="Fiyat (TL)" required></div><input class="input" name="duration" type="number" value="30" placeholder="Süre (dk)"><button class="btn">Hizmet Ekle</button></form>`;$('svc').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await api('/api/services',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await load()}}async function delSvc(id){await api('/api/services/'+id,{method:'DELETE'});await load()}function renderSettings(){const b=me.business;$('ayarlar').innerHTML=`<h3>İşletme Bilgileri</h3><form id="settings"><input class="input" name="name" value="${esc(b.name)}" placeholder="İşletme adı"><input class="input" name="address" value="${esc(b.address)}" placeholder="Adres"><input class="input" name="phone" value="${esc(b.phone)}" placeholder="Telefon"><textarea class="input" name="description" placeholder="Açıklama">${esc(b.description)}</textarea><button class="btn">Kaydet</button></form>`;$('settings').onsubmit=async e=>{e.preventDefault();await api('/api/business',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load()}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){try{me=await api('/api/me');render()}catch(err){if(err.message.includes('Oturumunuz sona ermiş')){me=null;render();}else{me=null;render();$('msg').className='err small';$('msg').textContent=err.message}}}function copyLink(){navigator.clipboard.writeText(location.origin+me.business.publicUrl);alert('Randevu linki kopyalandı.')}$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{if(!x.dataset.tab)return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));x.classList.add('active');document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('hidden',p.id!==x.dataset.tab))});$('tLogin').onclick=()=>setMode('login');$('tReg').onclick=()=>setMode('register');function setMode(m){mode=m;$('tLogin').classList.toggle('active',m==='login');$('tReg').classList.toggle('active',m==='register');$('bizWrap').classList.toggle('hidden',m!=='register');$('submit').textContent=m==='register'?'Hesap Oluştur':'Giriş Yap'}document.querySelector('#auth form').onsubmit=async e=>{e.preventDefault();try{let data={email:$('email').value,password:$('password').value};if(mode==='register')data.businessName=$('bizName').value;await api(mode==='register'?'/api/register':'/api/login',{method:'POST',body:JSON.stringify(data)});await load()}catch(err){$('msg').className='err small';$('msg').textContent=err.message}};load();</script></body></html>
