<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Randevu Al</title><style>body{margin:0;font-family:Inter,system-ui;background:#0b0b0d;color:#f6f0e5}.wrap{max-width:620px;margin:auto;padding:18px}.hero,.card{background:#151518;border:1px solid #29292d;border-radius:22px;padding:22px;margin:12px 0}.hero{text-align:center}.logo{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #e8c77b}.muted{color:#aaa}.input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #333;background:#101012;color:#fff;margin:6px 0 12px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time{padding:11px;border:1px solid #333;border-radius:10px;background:#1b1b1f;color:#fff;cursor:pointer}.time.active{background:#e8c77b;color:#111;border-color:#e8c77b}.svc{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid #303034;border-radius:12px;margin:8px 0;cursor:pointer}.svc.active{border-color:#e8c77b;background:#211e17}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#e8c77b;color:#111;font-weight:900;cursor:pointer}.ok{text-align:center;padding:25px}.err{color:#ff7777}.hidden{display:none}@media(max-width:500px){.grid{grid-template-columns:1fr}.times{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div id="loading" class="card">Yükleniyor...</div><div id="root" class="hidden"><section class="hero"><img id="logo" class="logo hidden"><h1 id="name"></h1><p id="desc" class="muted"></p><p id="address" class="muted"></p></section><section id="book" class="card"><h3>1. Hizmetini seç</h3><div id="services"></div><h3>2. Tarih ve saat</h3><input id="date" class="input" type="date"><div id="times" class="times"></div><h3>3. Bilgilerin</h3><input id="customerName" class="input" placeholder="Ad Soyad"><input id="phone" class="input" placeholder="Telefon"><textarea id="note" class="input" placeholder="Ek not (opsiyonel)"></textarea><button id="submit" class="btn">Randevuyu Onayla</button><p id="msg"></p></section><section id="success" class="card hidden ok"><div style="font-size:56px">✓</div><h2>Randevun oluşturuldu!</h2><p class="muted">Randevu bilgilerini işletme ile paylaşabilirsin.</p><p class="muted small"><a href="/kvkk.html" target="_blank">KVKK Aydınlatma</a> · <a href="/gizlilik.html" target="_blank">Gizlilik</a> · <a href="/kullanim-sartlari.html" target="_blank">Kullanım Şartları</a></p><button class="btn" onclick="location.reload()">Yeni Randevu</button></section></div></main><script>const slug=location.pathname.split('/').filter(Boolean)[1];let data,selected=null,time=null;const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Hata');return d}function today(){return new Date().toISOString().slice(0,10)}async function init(){try{data=await api('/api/public/'+slug);$('loading').classList.add('hidden');$('root').classList.remove('hidden');$('name').textContent=data.business.name;$('desc').textContent=data.business.description||'';$('address').textContent=data.business.address||'';if(data.business.logo){$('logo').src=data.business.logo;$('logo').classList.remove('hidden')}$('date').min=today();$('date').value=today();renderServices();renderTimes()}catch(e){$('loading').textContent=e.message}}function renderServices(){$('services').innerHTML=data.services.map(s=>`<div class="svc" data-id="${s.id}"><div><b>${s.name}</b><br><span class="muted">${s.duration} dk</span></div><strong>${s.price} TL</strong></div>`).join('');document.querySelectorAll('.svc').forEach(el=>el.onclick=()=>{document.querySelectorAll('.svc').forEach(x=>x.classList.remove('active'));el.classList.add('active');selected=el.dataset.id})}function renderTimes(){const d=new Date($('date').value+'T12:00:00'),names=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'],h=data.hours.find(x=>x.day===names[d.getDay()]);if(!h||!h.open){$('times').innerHTML='<span class="muted">Bu gün kapalı.</span>';return}let [oh,om]=h.openTime.split(':').map(Number),[ch,cm]=h.closeTime.split(':').map(Number),out='';for(let m=oh*60+om;m<ch*60+cm;m+=30){let hh=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');out+=`<button class="time" data-time="${hh}:${mm}">${hh}:${mm}</button>`}$('times').innerHTML=out;document.querySelectorAll('.time').forEach(el=>el.onclick=()=>{document.querySelectorAll('.time').forEach(x=>x.classList.remove('active'));el.classList.add('active');time=el.dataset.time})}$('date').onchange=()=>{time=null;renderTimes()};$('submit').onclick=async()=>{try{if(!selected||!time)throw Error('Hizmet ve saat seçmelisin.');if(!$('customerName').value.trim()||!$('phone').value.trim())throw Error('Ad soyad ve telefon gerekli.');await api('/api/public/'+slug+'/appointments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({serviceId:selected,date:$('date').value,time,customerName:$('customerName').value,phone:$('phone').value,note:$('note').value})});$('book').classList.add('hidden');$('success').classList.remove('hidden')}catch(e){$('msg').className='err';$('msg').textContent=e.message}};init();</script></body></html>
